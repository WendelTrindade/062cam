name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abrir o pacote do projeto
        run: |
          # Usa o .zip com a versao mais nova, qualquer que seja o nome do arquivo
          best=""
          bestv=-1
          for z in *.zip; do
            [ -f "$z" ] || continue
            v=$(unzip -p "$z" app/build.gradle.kts 2>/dev/null | grep -o 'versionCode = [0-9]*' | grep -o '[0-9]*' || true)
            [ -z "$v" ] && continue
            echo "Encontrado: $z (versao $v)"
            if [ "$v" -gt "$bestv" ]; then best="$z"; bestv=$v; fi
          done
          if [ -n "$best" ]; then
            unzip -o -q "$best" -x ".github/*"
            echo "USANDO: $best (versao $bestv)"
          fi
          if [ ! -d app ]; then
            echo "ERRO: nao achei nenhum .zip do 062 Cam na pagina principal do repositorio."
            exit 1
          fi
          grep -E "versionCode|versionName" app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Baixar modelo de voz em portugues
        run: |
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model-pt
          mv vosk-model-small-pt-0.3 app/src/main/assets/model-pt

      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: 062Cam-apk
          path: app/build/outputs/apk/debug/app-debug.apk
